hosts:
  - hepapi.com

prometheusRules:
  enabled: true
  expiringInfo:
    days: 90
    severity: info
  expiringWarning:
    days: 60
    severity: warning
  expiringCritical:
    days: 30
    severity: critical

prometheus:
  scrapeInterval: 300s
  scrapeTimeout: 100s

replicaCount: 1

image:
  repository: ghcr.io/dazwilkin/crtsh-exporter
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "crtsh-kubernetes"

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext:
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 9090

livenessProbe:
  httpGet:
    path: /healthz
    port: http

readinessProbe:
  httpGet:
    path: /healthz
    port: http

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}# resources:
#   limits:
#     cpu: 100m
#     memory: 128Mi
#   requests:
#     cpu: 100m
#     memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /healthz
    port: http
readinessProbe:
  httpGet:
    path: /healthz
    port: http

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
